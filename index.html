@import url('https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap');

.app{--petrol:#003851;--turkis:#00B7C4;--turkis-lys:#E0F6F8;
  --blekk:#16303C;--dus:#5B6E78;--papir:#F4F7F8;--flate:#FFFFFF;
  --linje:#D7E0E4;--aksent:#003851;--aksent-lys:#E4EDF1;
  --gronn:#1E7D5A;--gronn-lys:#E2F1EA;--rod:#A8443A;--rod-lys:#F6E6E3;
  --gul:#8A6D1F;--gul-lys:#F4EDD8;
  font-family:'Lato',system-ui,sans-serif;color:var(--blekk);
  background:var(--papir);min-height:100vh;padding:20px 16px 40px;
  max-width:760px;margin:0 auto;font-size:15px;line-height:1.5}
.app *{box-sizing:border-box}
.app h1,.app h2{font-family:'Lato',system-ui,sans-serif;font-weight:900;margin:0;color:var(--petrol)}

.topp{margin-bottom:18px}
.topp-logo{height:52px;display:block;margin-bottom:14px}
.topp-strek{height:3px;width:64px;background:var(--turkis);border-radius:2px;margin:12px 0 14px}
.topp h1{font-size:26px;line-height:1.2;letter-spacing:.01em}
.topp p{color:var(--dus);margin:8px 0 0;max-width:56ch}
.oppdrag-badge{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:var(--petrol);
  background:var(--turkis-lys);border:1px solid var(--turkis);
  border-radius:20px;padding:5px 14px;margin:10px 0 0}
.oppdrag-badge small{font-weight:400;text-transform:none;letter-spacing:0;color:var(--dus)}

.stegrad{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.steg{font:inherit;font-size:12.5px;font-weight:400;display:flex;gap:6px;align-items:center;
  padding:6px 10px;border-radius:20px;border:1px solid var(--linje);
  background:var(--flate);color:var(--dus);cursor:pointer}
.steg-nr{width:18px;height:18px;border-radius:50%;background:var(--papir);
  display:inline-flex;align-items:center;justify-content:center;
  font-size:10.5px;font-weight:700;border:1px solid var(--linje)}
.steg-on{border-color:var(--petrol);color:var(--petrol);background:var(--aksent-lys);font-weight:700}
.steg-on .steg-nr{background:var(--petrol);color:#fff;border-color:var(--petrol)}
.steg-ferdig{color:var(--turkis)}
.steg-ferdig .steg-nr{background:var(--turkis-lys);color:var(--petrol);border-color:var(--turkis-lys)}

.innledning{background:var(--flate);border:1px solid var(--linje);border-radius:14px;
  padding:26px 24px;margin-bottom:16px}
.innledning h2{font-size:20px;margin-bottom:10px}
.innledning p{margin:0 0 12px;max-width:62ch}
.innledning ul{margin:0 0 12px;padding-left:20px;color:var(--blekk)}
.innledning li{margin-bottom:6px}
.info-boks{background:var(--turkis-lys);border:1px solid var(--turkis);border-radius:10px;
  padding:12px 14px;font-size:13.5px;color:var(--petrol);margin:12px 0}

.sek-hode{margin:6px 0 14px}
.sek-hode h2{font-size:21px}
.sek-hode p{color:var(--dus);margin:6px 0 0;font-size:14px}
.krav-tag{color:var(--rod);font-size:12.5px;font-style:normal;font-weight:700}

.sp{background:var(--flate);border:1px solid var(--linje);border-radius:12px;
  padding:16px;margin-bottom:12px}
.sp-hode{display:flex;gap:10px;align-items:baseline}
.sp-nr{font-size:11.5px;font-weight:700;color:var(--turkis);letter-spacing:.05em}
.sp-tittel{font-weight:700;font-size:15.5px;color:var(--petrol)}
.sp-hjelp{color:var(--dus);font-size:13.5px;margin:4px 0 0}
.sp-kropp{margin-top:12px}

.valg{display:flex;gap:8px;flex-wrap:wrap}
.valg-knapp{font:inherit;font-size:13.5px;padding:8px 14px;border-radius:10px;
  border:1px solid var(--linje);background:var(--flate);color:var(--blekk);cursor:pointer}
.valg-knapp:hover{border-color:var(--petrol)}
.valg-on{border-color:var(--petrol);background:var(--petrol);color:#fff;font-weight:700}
.valg-sm .valg-knapp{font-size:12.5px;padding:6px 11px}

.janei{display:flex;gap:8px;flex-wrap:wrap}
.janei-knapp{font:inherit;font-size:13.5px;padding:8px 16px;border-radius:10px;
  border:1px solid var(--linje);background:var(--flate);cursor:pointer;color:var(--blekk)}
.jn-ja{border-color:var(--gronn);background:var(--gronn-lys);color:var(--gronn);font-weight:700}
.jn-nei{border-color:var(--petrol);background:var(--aksent-lys);color:var(--petrol);font-weight:700}
.jn-annet{border-color:var(--gul);background:var(--gul-lys);color:var(--gul);font-weight:700}

.jnv{display:flex;gap:6px;flex-wrap:wrap}
.jnv-knapp{font:inherit;font-size:12.5px;padding:6px 12px;border-radius:8px;
  border:1px solid var(--linje);background:var(--flate);cursor:pointer;color:var(--blekk)}
.jnv-on{border-color:var(--petrol);background:var(--petrol);color:#fff;font-weight:700}
.pastander{display:flex;flex-direction:column;gap:10px}
.pastand{display:flex;justify-content:space-between;align-items:center;gap:12px;
  background:var(--papir);border:1px solid var(--linje);border-radius:10px;padding:10px 12px}
.pastand span{font-size:13.5px;max-width:52ch}

.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{font:inherit;font-size:12.5px;padding:6px 12px;border-radius:16px;
  border:1px solid var(--linje);background:var(--flate);cursor:pointer;color:var(--blekk)}
.chip:hover{border-color:var(--turkis)}
.chip-on{border-color:var(--turkis);background:var(--turkis-lys);color:var(--petrol);font-weight:700}
.chip-nei{border-style:dashed}
.chip-nei-on{border-color:var(--gronn);border-style:solid;background:var(--gronn-lys);
  color:var(--gronn);font-weight:700}

.skadekort{border:1px solid var(--linje);border-left:3px solid var(--turkis);
  border-radius:10px;padding:12px 14px;margin-top:10px;background:var(--papir)}
.skadekort-tittel{font-weight:700;color:var(--petrol);font-size:14px;margin-bottom:8px}

.matgate{border:1px dashed var(--turkis);border-radius:10px;padding:12px 14px;
  margin-bottom:10px;background:var(--turkis-lys)}

.aarfelt{margin-top:6px}
.aar-input{font:inherit;font-size:14px;width:110px;padding:8px 10px;border-radius:8px;
  border:1px solid var(--linje);background:var(--flate)}
.aar-input:disabled{background:var(--papir);color:var(--dus)}
.aarfelt-krav .aar-input{border-color:var(--rod)}

.felt{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.felt-lbl{font-size:12.5px;font-weight:700;color:var(--dus)}
.felt input,.felt textarea,.felt select{font:inherit;font-size:14px;padding:8px 10px;
  border-radius:8px;border:1px solid var(--linje);background:var(--flate);width:100%}
.felt textarea{min-height:64px;resize:vertical}
.felt input:focus,.felt textarea:focus{outline:2px solid var(--turkis);outline-offset:0;border-color:var(--turkis)}
.felt-wide{width:100%}
.felt ::placeholder{color:#9FB2BB}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}

.innrykk{border-left:2px solid var(--linje);margin-top:10px;padding:2px 0 2px 14px}
.hint{color:var(--dus);font-size:12.5px;margin-top:6px}
.sjekk{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer;margin-top:8px}
.sjekk input{width:17px;height:17px;margin-top:2px;accent-color:var(--petrol)}

.rom{border:1px solid var(--linje);border-radius:12px;background:var(--flate);
  padding:14px;margin-bottom:12px}
.rom-hode{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.rom-tittel{font-weight:700;color:var(--petrol)}
.rom-navn{font:inherit;font-size:14px;font-weight:700;color:var(--petrol);
  border:1px solid transparent;border-radius:6px;padding:4px 8px;background:transparent;max-width:100%}
.rom-navn:hover,.rom-navn:focus{border-color:var(--linje);background:var(--papir);outline:none}
.rom-fjern{font:inherit;font-size:12px;border:none;background:none;color:var(--rod);
  cursor:pointer;text-decoration:underline}
.legg-til{font:inherit;font-size:13.5px;font-weight:700;padding:9px 16px;border-radius:10px;
  border:1px dashed var(--petrol);background:var(--aksent-lys);color:var(--petrol);cursor:pointer}
.kryss{font:inherit;border:none;background:none;color:var(--rod);cursor:pointer;font-size:15px}

.utfort{margin-top:8px}

.navrad{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px}
.navrad-status{font-size:12.5px;color:var(--dus)}
.primaer{font:inherit;font-size:14px;font-weight:700;padding:11px 22px;border-radius:10px;
  border:1px solid var(--petrol);background:var(--petrol);color:#fff;cursor:pointer}
.primaer:hover{background:#04506F}
.primaer:disabled{opacity:.4;cursor:default}
.sekundaer{font:inherit;font-size:14px;padding:11px 18px;border-radius:10px;
  border:1px solid var(--linje);background:var(--flate);color:var(--blekk);cursor:pointer}
.sekundaer:disabled{opacity:.4;cursor:default}

.opps-sek{background:var(--flate);border:1px solid var(--linje);border-radius:12px;
  padding:14px 16px;margin-bottom:12px}
.opps-tittel{font-weight:900;color:var(--petrol);font-size:15.5px}
.opps-kode{font-size:11.5px;color:var(--turkis);font-weight:700;letter-spacing:.05em;margin-left:8px}
.opps-rad{display:flex;justify-content:space-between;gap:14px;font-size:13.5px;
  padding:5px 0;border-bottom:1px dashed var(--linje)}
.opps-rad:last-child{border-bottom:none}
.opps-rad span:first-child{color:var(--dus)}
.opps-rad span:last-child{text-align:right;font-weight:700;max-width:55%}
.opps-inn1{padding-left:16px}
.opps-inn2{padding-left:32px}
.opps-inn1 span:first-child,.opps-inn2 span:first-child{font-size:12.5px}

.eksport-knapper{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

/* ---------- Utskrift / PDF ---------- */
.print-omraade{display:none}
@media print{
  body *{visibility:hidden}
  .print-omraade,.print-omraade *{visibility:visible}
  .print-omraade{display:block;position:absolute;left:0;top:0;width:100%}
  .skjerm{display:none}
}
.pdf{font-family:'Lato',system-ui,sans-serif;color:#16303C;font-size:11.5px;
  line-height:1.45;padding:28px 34px;max-width:210mm;margin:0 auto;background:#fff}
.pdf-topp{display:flex;justify-content:space-between;align-items:flex-start;
  border-bottom:3px solid #003851;padding-bottom:12px;margin-bottom:14px}
.pdf-logo{height:44px}
.pdf-h1{font-size:19px;font-weight:900;color:#003851;letter-spacing:.04em;text-align:right}
.pdf-meta{font-size:10.5px;color:#5B6E78;text-align:right;margin-top:4px}
.pdf-ingress{font-size:10.5px;color:#5B6E78;margin-bottom:12px;max-width:72ch}
.pdf-boks{border:1px solid #D7E0E4;border-left:3px solid #00B7C4;border-radius:6px;
  padding:8px 12px;margin-bottom:10px;font-size:11px}
.pdf-sek{margin-bottom:12px;break-inside:avoid}
.pdf-sek h2{font-size:13px;font-weight:900;color:#003851;margin:0 0 4px;
  border-bottom:1px solid #D7E0E4;padding-bottom:3px}
.pdf-sek h2 small{font-weight:400;color:#00939E;font-size:10px;margin-left:8px}
.pdf-sek table{width:100%;border-collapse:collapse}
.pdf-sek td{padding:3px 6px;vertical-align:top;border-bottom:1px dotted #E2E9EC}
.pdf-sek td:first-child{width:58%;color:#3C525E}
.pdf-sek td:last-child{font-weight:700;color:#16303C}
.pdf-inn1 td:first-child{padding-left:20px;font-size:10.8px}
.pdf-inn2 td:first-child{padding-left:36px;font-size:10.8px}
.pdf-dok-tittel{font-size:11px;font-weight:900;color:#003851;letter-spacing:.06em;
  text-transform:uppercase;margin:2px 0 6px}
.pdf-bunn{margin-top:16px;border-top:2px solid #003851;padding-top:8px;
  font-size:10px;color:#5B6E78}
